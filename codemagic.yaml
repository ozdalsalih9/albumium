workflows:
  ios-validation:
    name: iOS 17 simulator validation
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      flutter: 3.41.7
      xcode: latest
      cocoapods: default
    scripts:
      - name: Resolve dependencies
        script: flutter pub get
      - name: Analyze and test Dart
        script: |
          set -e
          flutter analyze
          flutter test
      - name: Compile iOS simulator
        script: flutter build ios --simulator --debug --no-codesign
      - name: Package simulator app
        script: ditto -c -k --sequesterRsrc --keepParent build/ios/iphonesimulator/Runner.app build/ios/Albumium-simulator.zip
      - name: Native tests
        script: |
          set -e
          DEVICE_ID=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(x["udid"] for r,ds in d["devices"].items() if "iOS" in r for x in ds if "iPhone" in x["name"]))')
          xcodebuild test -workspace ios/Runner.xcworkspace -scheme Runner -destination "platform=iOS Simulator,id=$DEVICE_ID" -resultBundlePath build/ios/RunnerTests.xcresult CODE_SIGNING_ALLOWED=NO
    artifacts:
      - build/ios/Albumium-simulator.zip
      - build/ios/RunnerTests.xcresult
      - /tmp/xcodebuild_logs/*.log

  ios-signing-setup:
    name: Prepare iOS App Store signing
    instance_type: mac_mini_m2
    max_build_duration: 15
    integrations:
      app_store_connect: Albumium Codemagic
    environment:
      xcode: latest
      vars:
        BUNDLE_ID: com.albumium.albumium
    scripts:
      - name: Create App Store bundle ID and provisioning profile
        script: |
          set -e

          first_resource_id() {
            python3 -c '
          import json
          import sys

          def find_id(value):
              if isinstance(value, dict):
                  resource_id = value.get("id")
                  if isinstance(resource_id, str):
                      return resource_id
                  if "data" in value:
                      found = find_id(value["data"])
                      if found:
                          return found
                  for child in value.values():
                      found = find_id(child)
                      if found:
                          return found
              elif isinstance(value, list):
                  for child in value:
                      found = find_id(child)
                      if found:
                          return found
              return ""

          print(find_id(json.load(sys.stdin)))
          '
          }

          bundle_response="$(app-store-connect bundle-ids list \
            --bundle-id-identifier "$BUNDLE_ID" \
            --strict-match-identifier \
            --json)"
          bundle_resource_id="$(printf '%s' "$bundle_response" | first_resource_id)"

          if [ -z "$bundle_resource_id" ]; then
            bundle_response="$(app-store-connect bundle-ids create "$BUNDLE_ID" \
              --name "Albumium" \
              --platform IOS \
              --json)"
            bundle_resource_id="$(printf '%s' "$bundle_response" | first_resource_id)"
          fi

          certificate_response="$(app-store-connect certificates list \
            --profile-type IOS_APP_STORE \
            --json)"
          certificate_resource_id="$(printf '%s' "$certificate_response" | first_resource_id)"

          if [ -z "$bundle_resource_id" ] || [ -z "$certificate_resource_id" ]; then
            echo "Could not resolve the Apple bundle ID or distribution certificate."
            exit 1
          fi

          profile_response="$(app-store-connect profiles list \
            --name "Albumium App Store" \
            --type IOS_APP_STORE \
            --state ACTIVE \
            --json)"
          profile_resource_id="$(printf '%s' "$profile_response" | first_resource_id)"

          if [ -z "$profile_resource_id" ]; then
            app-store-connect profiles create "$bundle_resource_id" \
              --certificate-ids "$certificate_resource_id" \
              --type IOS_APP_STORE \
              --name "Albumium App Store" \
              --save
          else
            app-store-connect profiles list \
              --name "Albumium App Store" \
              --type IOS_APP_STORE \
              --state ACTIVE \
              --save
          fi
    artifacts:
      - $HOME/Library/Developer/Xcode/UserData/Provisioning Profiles/*.mobileprovision

  ios-testflight:
    name: Signed iOS TestFlight candidate
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      app_store_connect: Albumium Codemagic
    environment:
      flutter: 3.41.7
      xcode: latest
      cocoapods: default
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.albumium.albumium
    scripts:
      - name: Resolve, analyze and test
        script: |
          set -e
          flutter pub get
          flutter analyze
          flutter test
      - name: Apply signing profiles
        script: xcode-project use-profiles
      - name: Build IPA
        script: flutter build ipa --release --build-number=$PROJECT_BUILD_NUMBER --export-options-plist=/Users/builder/export_options.plist
    artifacts:
      - build/ios/ipa/*.ipa
      - build/ios/archive/*.xcarchive
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: false
