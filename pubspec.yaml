name: albumium
description: "Anılarını etkileşimli dijital albümlere dönüştür."
publish_to: 'none'

version: 1.30.1+53

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  image_picker: ^1.2.3
  image_picker_android: 0.8.13+17
  image_picker_platform_interface: ^2.11.1
  shared_preferences: ^2.5.5
  path_provider: ^2.1.6
  share_plus: ^13.3.0
  # Vendored with an Android bitrate fix; see packages/flutter_quick_video_encoder/CHANGELOG.md
  flutter_quick_video_encoder:
    path: packages/flutter_quick_video_encoder
  google_fonts: ^6.2.1
  archive: ^4.2.0
  crypto: ^3.0.7
  image: ^4.9.2
  gal: ^2.3.3
  google_mobile_ads: ^9.1.0
  in_app_purchase: ^3.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/branding/
    - assets/covers/
    - assets/fonts/google/
    - assets/stickers/
    - assets/textures/
  fonts:
    - family: AlbumiumSans
      fonts:
        - asset: assets/fonts/google/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/google/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/google/Inter-ExtraBold.ttf
          weight: 800
    - family: AlbumiumDisplay
      fonts:
        - asset: assets/fonts/google/Marcellus-Regular.ttf
          weight: 400
