name: albumium
description: "Anılarını etkileşimli dijital albümlere dönüştür."
publish_to: 'none'

version: 1.7.0+11

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  image_picker: ^1.2.3
  shared_preferences: ^2.5.5
  path_provider: ^2.1.6
  share_plus: ^13.3.0
  flutter_quick_video_encoder: ^1.7.2
  google_fonts: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/branding/
    - assets/covers/
    - assets/fonts/google/
    - assets/stickers/
  fonts:
    - family: AlbumiumSans
      fonts:
        - asset: assets/fonts/google/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/google/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/google/Inter-ExtraBold.ttf
          weight: 800
    - family: AlbumiumDisplay
      fonts:
        - asset: assets/fonts/google/Marcellus-Regular.ttf
          weight: 400
